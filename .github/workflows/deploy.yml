name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    # Jeden Montag 04:00 UTC: Diyanet-Tabellen neu laden und neu deployen
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Diyanet-Tabellen aktualisieren
        run: npm run fetch-diyanet
        continue-on-error: true # Wenn die Diyanet-Seite nicht erreichbar ist, bleiben die alten Tabellen

      - name: Aktualisierte Tabellen committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/diyanet/*.json
          git diff --cached --quiet || git commit -m "chore: Diyanet-Tabellen aktualisiert"
          git push

      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
